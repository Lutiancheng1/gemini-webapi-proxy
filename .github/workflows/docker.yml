name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "src/**"
      - "uv.lock"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Docker tag components must be lowercase; the GitHub repository
  # name preserves the user's casing, so we lowercase before
  # composing any tag.  The image registry itself is case-
  # insensitive on push but the tag literal is not.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build each platform in its own job.  Each job pushes ONLY its
  # own per-platform image (tagged with a `-<platform>` suffix)
  # plus a unique digest, never a user-facing tag.  The `merge`
  # job below then combines the per-platform images into a
  # single multi-arch manifest list and re-tags it with the
  # user-facing tags.  This avoids the previous bug where each
  # matrix job pushed the same user-facing tag and the later push
  # overwrote the earlier manifest list with a single-platform
  # image.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Per-platform staging tag: lowercase the registry path
      # (Docker requires lowercase) and replace the platform
      # slash with a dash.  This step MUST run before the
      # Build & push step.
      - name: Compute staging tag
        id: slug
        run: |
          platform_dash=$(echo "${{ matrix.platform }}" | tr '/' '-')
          image_lower=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          staging="${{ env.REGISTRY }}/${image_lower}:${{ steps.meta.outputs.version }}-${platform_dash}"
          echo "staging=${staging}" >> "$GITHUB_OUTPUT"
          echo "staging=${staging}"

      - name: Build & push (per-platform, no user tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.slug.outputs.staging }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Merge multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build manifest list and apply user tags
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          image_lower=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          image_repo="${{ env.REGISTRY }}/${image_lower}"
          # Per-platform images (staging tags) were pushed by the
          # build matrix.  Tag component cannot contain '/', so
          # we replace the platform slash with a dash.
          sources=()
          for plat in linux/amd64 linux/arm64; do
            plat_dash=$(echo "$plat" | tr '/' '-')
            staging="${image_repo}:${version}-${plat_dash}"
            echo "Including staging image: $staging"
            sources+=("$staging")
          done

          # Apply every user-facing tag from metadata-action to the
          # combined multi-arch manifest list.  We feed the
          # newline-separated TAGS env var through `read` rather
          # than `for tag in $TAGS` because the latter breaks on
          # tags containing shell metacharacters.
          #
          # `docker buildx imagetools create` takes SOURCE refs as
          # positional args (no --image flag), and `--platform` to
          # declare which platforms the resulting manifest list
          # should advertise.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Creating manifest list $tag"
            docker buildx imagetools create \
              "${sources[@]}" \
              --tag "$tag" \
              --platform linux/amd64,linux/arm64 \
              --provenance=false
          done <<< "$TAGS"

          # Drop the per-platform staging tags — they're no longer
          # useful and add noise to the package listing.
          for plat in linux/amd64 linux/arm64; do
            plat_dash=$(echo "$plat" | tr '/' '-')
            docker buildx imagetools rm -f "${image_repo}:${version}-${plat_dash}" || true
          done
