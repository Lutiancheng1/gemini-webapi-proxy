# Pre-commit hook configuration. Install once with:
#
#     pip install pre-commit
#     pre-commit install
#
# Then `git commit` will run ruff, format-check, and a few basic sanity
# hooks before letting the commit land. CI also runs the same checks.
#
# See https://pre-commit.com for details.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
